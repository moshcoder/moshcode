# The monorepo's workspace roots.
#
# `apps/pwa` is deliberately ABSENT. It has never been a workspace member — a
# root install skips its dependencies on purpose — and enrolling it would change
# how the pit resolves its own tree as a side effect of a repo reorganisation.
# That is a separate decision, made separately.
packages:
  - apps/qryptchat-web
  - packages/*

# ---------------------------------------------------------------------------
# Carried up from apps/qryptchat-web/pnpm-workspace.yaml when that app joined
# the workspace.
#
# pnpm reads `overrides` and `onlyBuiltDependencies` from the WORKSPACE ROOT and
# nowhere else. Left in the nested file they are silently ignored — the install
# succeeds, the lockfile stops recording them, and the security pins below
# quietly stop applying. That failure has no error message, which is exactly why
# they live here rather than beside the app they came from.
#
# pnpm v10 moved these out of package.json's "pnpm" block. Source of truth:
# https://pnpm.io/settings#overrides
# ---------------------------------------------------------------------------
overrides:
  glob: ">=10.5.0"
  jws: ">=3.2.3"
  js-yaml: ">=4.1.1"
  cookie: "1.1.1"
  diff: "8.0.4"
  serialize-javascript: "7.0.5"

# pnpm v10 sandboxes install scripts by default. Anything not listed here gets
# its postinstall skipped — and in CI (or any non-interactive context) that
# becomes ERR_PNPM_IGNORED_BUILDS instead of a warning. These need their
# native-build / setup hooks to run.
onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
