# dev.moshcode.sh — the dev instance of the PWA.
#
# This is a TEMPLATE. bootstrap.sh substitutes the @NAME@ placeholders and
# writes the result to deploy/out/@APP_HOST@.conf. Install that one.
#
# The app serves plain HTTP on 127.0.0.1:@APP_PORT@ on purpose, the same way
# dns.moshcode.sh does: the certificate lives here, in the one place on the box
# that already renews certificates. An app that manages its own certificate
# goes down when that certificate expires, and takes the environment with it on
# a day nobody changed anything.
#
# Do not hand-edit this into /etc/nginx. The userdir configuration on the dev
# box is generated by dottemplates and regenerating it discards manual edits —
# a vhost belongs in sites-available as its own file, symlinked into
# sites-enabled, which is what bootstrap.sh prints the commands for.

server {
    listen 80;
    listen [::]:80;

    server_name @APP_HOST@;

    # Kept after the certificate is issued so renewals validate over HTTP-01
    # without a config shuffle. Losing this is a 90-day fuse, not an outage you
    # notice today.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name @APP_HOST@;

    ssl_certificate     /etc/letsencrypt/live/@APP_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@APP_HOST@/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The publishing endpoint takes a batch of up to MAX_BATCH items, which the
    # app sizes itself for (MAX_PUBLISH_BYTES in lib/moshpit-content.mjs, ~1.9M).
    # nginx's 1m default would cut that down again, turning a batch the app
    # would have accepted into a 413 from the proxy — so this sits just above
    # the app's own ceiling and lets the app be the one that says no.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:@APP_PORT@;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app builds redirect and callback URLs as http://,
        # which breaks the OAuth round-trip and downgrades the session cookie.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # /n/<name> fetches a target server-side before it can answer, so the
        # gateway's own 10s origin budget has to fit inside nginx's.
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Bulk publish. Everything about this location exists because the endpoint
    # streams in both directions, and nginx's defaults quietly undo that.
    location ~ ^/api/moshpit/sites/[^/]+/content/stream$ {
        proxy_pass http://127.0.0.1:@APP_PORT@;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The upload is NDJSON read a line at a time, so the app never holds
        # more than one item. This is the cap on the whole upload rather than
        # on what fits in memory — the app enforces its own item and byte
        # limits underneath it.
        client_max_body_size 128m;

        # THE important one. nginx buffers a request body to disk by default and
        # only then contacts the app, which would turn "items land while the
        # rest uploads" into one long silence followed by everything at once —
        # the exact behaviour the streaming endpoint exists to avoid.
        proxy_request_buffering off;
        # The same, for the progress lines coming back. The app also sends
        # X-Accel-Buffering: no, so this is belt and braces for an nginx that
        # was built to ignore the header.
        proxy_buffering off;
        # Chunked upload needs HTTP/1.1 upstream; the default is 1.0, which
        # cannot express a body of unknown length.
        proxy_http_version 1.1;

        # A big import is legitimately slow. The progress lines keep the
        # response side busy, but the request side can be quiet while a client
        # on a poor uplink sends one item, so both directions get room. The
        # app's own idle timeout is the tighter, smarter limit.
        proxy_read_timeout    10m;
        proxy_send_timeout    10m;
    }

    # Cheap liveness probe that does not touch the database.
    location = /healthz {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_set_header Host $host;
        access_log off;
    }
}
